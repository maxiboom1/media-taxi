<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>Media Taxi · Activity</title><link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script></head>
<body>
  <header class="site-header"><div class="brand"><img src="/media-taxi.svg" width="104" height="32" alt="Media Taxi"><h1>Media Taxi Ingest</h1></div><nav aria-label="Main navigation"><a class="selected" href="/" aria-current="page">Activity</a><a href="/admin">System</a></nav></header>
  <main id="activity-scroll" class="activity-scroll" aria-label="Ingest activity">
    <table id="activity-table" class="activity-table"><thead id="activity-head"><tr><th>Date</th><th>Clip Name</th><th>Clip Format</th><th>Processing</th><th>Proxy</th></tr></thead><tbody id="activity-body"></tbody></table>
    <div id="empty-state" class="empty-state">Waiting for incoming media</div>
  </main>
  <footer class="status-footer"><span id="footer-message" tabindex="0" role="status">Connecting to Media Taxi…</span><div id="footer-statistics" aria-label="Last 24 hours statistics"></div></footer>
</body>
</html>
