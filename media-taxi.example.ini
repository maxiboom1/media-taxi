; Media Taxi 0.2.0. Copy to media-taxi.ini next to MediaTaxi.exe, or use --config PATH.
; All relative paths resolve against THIS file's directory. Changes require restart.
; Create folders and assign permissions before running. Missing source roots NEVER mean empty.
; Source folders are scanned at top level; Finished/Failed may be children of Watch.
[folders]
watch = storage/watch
finished = storage/finished
failed = storage/failed
; Local operator-readable, retained <clip-name>.clip files. No age-based expiry.
abekas = storage/abekas
proxy = storage/proxies
work = runtime/work
; SQLite + instance lock must be on LOCAL storage, not a network share.
state = runtime/state

[media]
ffmpeg = tools/ffmpeg.exe
ffprobe = tools/ffprobe.exe
; false = incompatible sources go to Failed; true = normalize qualified SDR inputs.
allow_normalization = false
; Encoder threads per process, integer 1..256.
threads = 4
; Child-process timeout in seconds, integer 10..86400.
timeout_seconds = 3600

[workers]
; Positive integers 1..64. Native ingest/probe, normalization, proxies and copy limits independent.
native = 2
normalize = 1
proxy = 1
copy = 4
copies_per_destination = 1

[timing]
; Seconds, 0.1..86400. Readiness also requires readable media and deny-write protection.
stability_seconds = 10
reconcile_seconds = 10
inventory_poll_seconds = 30
inventory_timeout_seconds = 5
reconnect_seconds = 5

[proxy]
; h264 (default) or h265. External Octopus player compatibility is operator-validated.
codec = h264
; Even dimensions: width 2..3840, height 2..2160; fps integer 1..50.
width = 640
height = 360
fps = 50
; bitrate or crf. Bitrates are positive bits/sec with optional k/M suffix.
rate_control = bitrate
video_bitrate = 1200k
audio_bitrate = 128k
; CRF integer 0..51, used only when rate_control=crf.
crf = 26
; ultrafast, superfast, veryfast, faster, fast, medium, slow, slower, veryslow.
preset = fast
; One or two distinct, one-based channel indexes 1..8; never automatic downmixing.
channels = 1,2

[web]
; HTTP address + port, no subpath; use the broadcast LAN address or localhost.
listen = http://0.0.0.0:8080
time_zone = Asia/Jerusalem

[logging]
; Console verbosity: Trace, Debug, Information, Warning, Error, Critical or None.
level = Information

; One to four ENABLED destinations. IDs unique: letters/digits/dash/underscore.
; A single initial copy attempt per destination. NO resend, overwrite or auto re-sync.
; For UNC shares use e.g. path = \\TRIA-1\Media, under the console account's credentials.
[destinations:TLV1]
enabled = true
name = TLV1
path = storage/destination-TLV1
; Documentation-only placeholder. Replace before deployment.
host = 192.0.2.11
port = 5254
inventory_folder = IMPORTS

[destinations:TLV2]
enabled = false
name = TLV2
path = storage/destination-TLV2
host = 192.0.2.12
port = 5254
inventory_folder = IMPORTS

; Lifecycle is SOURCE MEMBERSHIP, not a 02:00 timer or 72-hour cleanup.
; Retire only after two successful absent source scans. Delete only owned local
; .clip/MP4/work artifacts; never delete completed server clips or source archives.
